version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*", "NSubstitute", "NetArchTest*", "Microsoft.AspNetCore.Mvc.Testing"]
    ignore:
      # 8.x requires a commercial licence
      - dependency-name: FluentAssertions
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/src/Web/hrms-web"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]

  - package-ecosystem: pub
    directory: "/src/Mobile/hrms_mobile"
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: "/deploy"
    schedule: { interval: monthly }
